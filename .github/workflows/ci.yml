name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  BUN_VERSION: "1.3.13"
  TAILSCALE_VERSION: "1.96.4"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Test, Build, Typecheck, Lint, Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Install Tailscale CLI
        run: |
          . /etc/os-release
          curl -fsSL "https://pkgs.tailscale.com/stable/${ID}/${VERSION_CODENAME}.noarmor.gpg" | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
          curl -fsSL "https://pkgs.tailscale.com/stable/${ID}/${VERSION_CODENAME}.tailscale-keyring.list" | sudo tee /etc/apt/sources.list.d/tailscale.list
          sudo apt-get update
          sudo apt-get install -y "tailscale=${TAILSCALE_VERSION}"
          tailscale version

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Verify build artifacts
        run: test -f dist/index.js

      - name: Build compiled binary
        run: bun run build:binary

      - name: Smoke check compiled binary
        env:
          TAILSCALE_API_KEY: tskey-api-FAKE
          TAILSCALE_TAILNET: "-"
          LOG_LEVEL: error
        run: bash scripts/smoke-check-binary.sh ./dist/server 5

      - name: Audit dependencies
        run: bun audit --audit-level=moderate
