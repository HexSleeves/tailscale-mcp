name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "patch"
        type: choice
        options: [patch, minor, major, prerelease]

env:
  BUN_VERSION: "1.3.13"

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Cut release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint + typecheck + tests
        run: bun run qa

      - name: Build (binary + node bundle)
        run: |
          bun run build
          bun run build:node

      - name: Verify artifacts
        run: |
          test -x dist/server
          test -f dist/server.mjs

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        env:
          BUMP_TYPE: ${{ github.event.inputs.release_type }}
        run: |
          OLD=$(jq -r .version package.json)
          npm version "$BUMP_TYPE" --no-git-tag-version --allow-same-version >/dev/null
          NEW=$(jq -r .version package.json)
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW" >> "$GITHUB_OUTPUT"

      - name: Generate changelog snippet
        id: changelog
        run: |
          OLD_TAG="v${{ steps.bump.outputs.old }}"
          if git rev-parse "$OLD_TAG" >/dev/null 2>&1; then
            BODY=$(git log --pretty=format:"- %s (%h)" "$OLD_TAG"..HEAD)
          else
            BODY=$(git log --pretty=format:"- %s (%h)" --max-count=20)
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit + tag
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git add package.json bun.lock || true
          git commit -m "chore: release v${NEW_VERSION}"
          git tag "v${NEW_VERSION}"
          git push origin HEAD
          git push origin "v${NEW_VERSION}"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ steps.bump.outputs.version }}
          path: dist/
          retention-days: 30

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: ${{ contains(steps.bump.outputs.version, 'rc') || contains(steps.bump.outputs.version, 'beta') || contains(steps.bump.outputs.version, 'alpha') }}
          files: |
            dist/server
            dist/server.mjs

  docker:
    name: Publish image
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.tag }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
