name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish, for example v1.2.3"
        required: true
        type: string

env:
  NODE_VERSION: "20"
  BUN_VERSION: "1.3.13"
  TAILSCALE_VERSION: "1.96.4"

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  npm-release:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-release-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v${PACKAGE_VERSION}"

          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ] && [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "Release workflow must run from a version tag, expected ${EXPECTED_TAG}."
            exit 1
          fi

          if [ "${RELEASE_TAG}" != "${EXPECTED_TAG}" ]; then
            echo "Tag ${RELEASE_TAG} does not match package.json version ${PACKAGE_VERSION}."
            exit 1
          fi

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Install Tailscale CLI
        run: |
          . /etc/os-release
          curl -fsSL "https://pkgs.tailscale.com/stable/${ID}/${VERSION_CODENAME}.noarmor.gpg" | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
          curl -fsSL "https://pkgs.tailscale.com/stable/${ID}/${VERSION_CODENAME}.tailscale-keyring.list" | sudo tee /etc/apt/sources.list.d/tailscale.list
          sudo apt-get update
          sudo apt-get install -y "tailscale=${TAILSCALE_VERSION}"
          tailscale version

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Verify build artifacts
        run: test -f dist/index.js

      - name: Build compiled binary
        run: bun run build:binary

      - name: Smoke check compiled binary
        env:
          TAILSCALE_API_KEY: tskey-api-FAKE
          TAILSCALE_TAILNET: "-"
          LOG_LEVEL: error
        run: bash scripts/smoke-check-binary.sh ./dist/server 5

      - name: Audit dependencies
        run: bun audit --audit-level=moderate

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN is required to publish."
            exit 1
          fi

          PRERELEASE_TAG=$(node -e "const version = require('./package.json').version; const prerelease = version.split('-')[1]; process.stdout.write(prerelease ? prerelease.split('.')[0] : '');")

          if [ -n "${PRERELEASE_TAG}" ]; then
            bun publish --tag "${PRERELEASE_TAG}" --access public
          else
            bun publish --access public
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          name: Release ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name, 'alpha') || contains(github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name, 'beta') || contains(github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name, 'rc') }}
