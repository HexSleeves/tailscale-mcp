name: Bug Report
description: Report a problem with the Tailscale MCP Server
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in as much detail as you can.

        **Before submitting:** search existing issues to avoid duplicates.

  - type: input
    id: version
    attributes:
      label: Package version
      description: Run `npx @hexsleeves/tailscale-mcp-server --version` or check your lock file.
      placeholder: "1.2.0"
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: Installation method
      options:
        - npx (npx -y @hexsleeves/tailscale-mcp-server)
        - Docker Hub (hexsleeves/tailscale-mcp-server)
        - GHCR (ghcr.io/hexsleeves/tailscale-mcp-server)
        - Built from source
    validations:
      required: true

  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options:
        - stdio (default)
        - HTTP
    validations:
      required: true

  - type: dropdown
    id: auth_method
    attributes:
      label: Authentication method
      options:
        - OAuth client credentials (TAILSCALE_OAUTH_CLIENT_ID + SECRET)
        - API key (TAILSCALE_API_KEY)
    validations:
      required: true

  - type: dropdown
    id: risk_level
    attributes:
      label: TAILSCALE_ALLOWED_TOOL_RISK setting
      options:
        - read (default)
        - write
        - admin
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Set env vars ...
        2. Call tool ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        Set `LOG_LEVEL=debug` and paste relevant output here.

        **IMPORTANT: Redact all API keys, OAuth secrets, bearer tokens, and auth key values before posting.**
      render: text

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node.js or Bun version, OS, MCP client name and version.
      placeholder: |
        Node.js 22.x / Bun 1.3.x
        macOS 15 / Ubuntu 24.04
        Claude Desktop 1.x
